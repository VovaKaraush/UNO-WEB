<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Web - Partie</title>
  <link rel="stylesheet" href="/Game/styles.css">
</head>

<body>
<div id="app">

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="logo-sm">UNO</div>

    <div id="turn-banner">En attente de la partie...</div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button id="pass-btn">Passer ›</button>
      <div id="deck-counter">🃏 <span id="deck-count">—</span></div>
    </div>
  </header>

  <!-- ARENA -->
  <section id="arena">

    <!-- Opponents (left) -->
    <div id="opponents"></div>

    <!-- Table center -->
    <div id="table-center">
      <div id="wild-color-bar">
        <div class="dot" id="wild-dot"></div>
        <span id="wild-label">Couleur : —</span>
      </div>

      <div class="table-felt">
        <!-- Draw pile -->
        <div class="draw-pile" id="draw-pile" title="Piocher">
          <span style="position:relative;z-index:1;">UNO</span>
        </div>

        <!-- Discard / top card -->
        <div class="uno-card" id="top-card" style="cursor:default;">
          <span class="card-label">?</span>
        </div>
      </div>
    </div>

    <!-- Side actions (right) -->
    <div id="side-actions">
      <button class="action-btn danger" id="quit-btn">✕ Quitter</button>
    </div>

  </section>

  <!-- PLAYER HAND -->
  <div id="player-zone">
    <div id="player-label">TA MAIN</div>
    <div id="hand-container"></div>
  </div>

</div>

<!-- UNO button -->
<button id="uno-btn">UNO!</button>

<!-- Toast notification -->
<div id="toast"></div>

<!-- Waiting overlay -->
<div class="overlay visible" id="waiting-overlay">
  <div class="modal">
    <h2>Connexion...</h2>
    <div class="spinner"></div>
    <p>En attente que la partie démarre</p>
  </div>
</div>

<!-- Color picker overlay -->
<div class="overlay" id="color-overlay">
  <div class="modal">
    <h2>Choisis une couleur</h2>
    <p>Tu joues une carte joker</p>
    <div id="color-grid">
      <button class="color-choice red"    data-color="red">🔴 Rouge</button>
      <button class="color-choice yellow" data-color="yellow">🟡 Jaune</button>
      <button class="color-choice blue"   data-color="blue">🔵 Bleu</button>
      <button class="color-choice green"  data-color="green">🟢 Vert</button>
    </div>
  </div>
</div>

<!-- Winner overlay -->
<div class="overlay" id="winner-overlay">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h2 id="winner-text">Victoire !</h2>
    <p id="winner-sub">Partie terminée</p>
    <button class="action-btn primary" id="reset-btn" style="width:100%;margin-top:8px;padding:16px;">
      Rejouer
    </button>
    <button class="action-btn" id="quit-win-btn" style="width:100%;margin-top:8px;padding:14px;">
      Menu principal
    </button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ─── State ────────────────────────────────────────────
  const socket  = io();
  let myName     = null;
  let myIndex    = null;
  let gameState  = null;
  let hasDrawn   = false;

  // ─── Get current user ─────────────────────────────────
  try {
    const u = JSON.parse(localStorage.getItem('user'));
    if (u?.username) myName = u.username;
  } catch {}

  // ─── DOM refs ─────────────────────────────────────────
  const turnBanner    = document.getElementById('turn-banner');
  const deckCountEl   = document.getElementById('deck-count');
  const topCardEl     = document.getElementById('top-card');
  const drawPileEl    = document.getElementById('draw-pile');
  const handContainer = document.getElementById('hand-container');
  const opponentsEl   = document.getElementById('opponents');
  const passBtn       = document.getElementById('pass-btn');
  const unoBtnEl      = document.getElementById('uno-btn');
  const wildBar       = document.getElementById('wild-color-bar');
  const wildDot       = document.getElementById('wild-dot');
  const wildLabel     = document.getElementById('wild-label');
  const waitOverlay   = document.getElementById('waiting-overlay');
  const colorOverlay  = document.getElementById('color-overlay');
  const winnerOverlay = document.getElementById('winner-overlay');
  const winnerText    = document.getElementById('winner-text');
  const winnerSub     = document.getElementById('winner-sub');
  const toastEl       = document.getElementById('toast');

  // ─── Helpers ──────────────────────────────────────────
  function showToast(msg, duration = 2500) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function colorClass(color) {
    const map = { red:'color-red', yellow:'color-yellow', blue:'color-blue', green:'color-green', wild:'color-wild' };
    return map[color] || 'color-wild';
  }

  function cardLabel(card) {
    const icons = { skip:'⊘', reverse:'↺', draw2:'+2', wild:'★', draw4:'+4' };
    return icons[card.value] ?? card.value;
  }

  function buildCard(card, { playable=false, onClick=null, small=false } = {}) {
    const el = document.createElement('div');
    el.className = `uno-card ${colorClass(card.color)}${playable ? ' playable' : ''}`;

    const label = document.createElement('span');
    label.className = 'card-label';
    label.textContent = cardLabel(card);
    el.appendChild(label);

    if (playable && onClick) el.addEventListener('click', onClick);
    return el;
  }

  // ─── Render game state ────────────────────────────────
  function render(state) {
    gameState = state;
    const isMyTurn = myIndex !== null && state.current_player === myIndex;

    // Turn banner
    const currentName = state.players[state.current_player]?.name ?? '?';
    turnBanner.textContent = isMyTurn ? '🎯 C\'EST TON TOUR !' : `Tour de ${currentName}`;
    turnBanner.style.color = isMyTurn ? 'var(--gold)' : 'rgba(255,255,255,0.6)';

    // Deck count
    deckCountEl.textContent = state.deckCount;

    // Top card (discard)
    topCardEl.className = 'uno-card';
    if (state.topCard) {
      topCardEl.classList.add(colorClass(state.topCard.color));
      topCardEl.querySelector('.card-label').textContent = cardLabel(state.topCard);
    } else {
      topCardEl.querySelector('.card-label').textContent = '?';
    }

    // Wild color bar
    if (state.wild_color) {
      wildBar.classList.add('visible');
      const colorMap = { red:'#e52323', yellow:'#ffd400', blue:'#006dff', green:'#00a651' };
      const nameMap  = { red:'Rouge', yellow:'Jaune', blue:'Bleu', green:'Vert' };
      wildDot.style.background = colorMap[state.wild_color] || '#888';
      wildLabel.textContent = `Couleur imposée : ${nameMap[state.wild_color] ?? state.wild_color}`;
      wildBar.style.borderColor = colorMap[state.wild_color] || '#888';
    } else {
      wildBar.classList.remove('visible');
    }

    // Opponents
    opponentsEl.innerHTML = '';
    state.players.forEach((p, i) => {
      if (i === myIndex) return;
      const slot = document.createElement('div');
      const isActive = state.current_player === i;
      const isUno    = p.cardCount === 1;

      slot.className = `opponent-slot${isActive ? ' active-player' : ''}${isUno ? ' uno-alert' : ''}`;
      slot.innerHTML = `
        <div class="opp-avatar">${p.name[0]?.toUpperCase() ?? '?'}</div>
        <div class="opp-info">
          <div class="opp-name">${p.name}${isUno ? ' 🔴 UNO!' : ''}</div>
          <div class="opp-cards">${p.cardCount} carte${p.cardCount !== 1 ? 's' : ''}</div>
        </div>
        <div class="opp-hand">${Array.from({length: Math.min(p.cardCount, 10)}).map(() => '<div class="mini-card"></div>').join('')}</div>
      `;
      opponentsEl.appendChild(slot);
    });

    // Player hand
    handContainer.innerHTML = '';
    const myPlayer = myIndex !== null ? state.players[myIndex] : null;
    if (myPlayer?.hand) {
      myPlayer.hand.forEach((card, idx) => {
        const playable = isMyTurn && state.playable?.[idx];
        const cardEl = buildCard(card, {
          playable,
          onClick: playable ? () => onPlayCard(idx, card) : null
        });
        // Subtle stagger
        cardEl.style.animationDelay = `${idx * 30}ms`;
        handContainer.appendChild(cardEl);
      });
    }

    // Draw pile click (only on my turn, if haven't drawn yet)
    drawPileEl.onclick = isMyTurn ? onDrawCard : null;
    drawPileEl.style.opacity = isMyTurn ? '1' : '0.5';

    // Pass button (only after drawing)
    passBtn.classList.toggle('visible', isMyTurn && hasDrawn);

    // UNO button (when I have 2 cards and it's my turn — shout before playing last)
    const myCardCount = myPlayer?.hand?.length ?? 99;
    unoBtnEl.classList.toggle('visible', myCardCount <= 2 && isMyTurn);

    // Winner check
    if (state.winner) {
      const isWinner = state.winner === myName;
      winnerText.textContent = isWinner ? '🏆 Tu as gagné !' : `${state.winner} a gagné !`;
      winnerSub.textContent  = isWinner ? 'Bravo, UNO master !' : 'Meilleure chance la prochaine fois !';
      winnerOverlay.classList.add('visible');
    }
  }

  // ─── Actions ──────────────────────────────────────────
  function onPlayCard(idx, card) {
    if (!gameState) return;
    hasDrawn = false;
    socket.emit('playCard', { cardIndex: idx });

    // If wild/draw4, show color picker
    if (card.value === 'wild' || card.value === 'draw4') {
      colorOverlay.classList.add('visible');
    }
  }

  function onDrawCard() {
    if (hasDrawn) { showToast('Tu as déjà pioché, passe ou joue une carte'); return; }
    hasDrawn = true;
    socket.emit('drawCard');
  }

  passBtn.addEventListener('click', () => {
    hasDrawn = false;
    socket.emit('passTurn');
  });

  unoBtnEl.addEventListener('click', () => {
    showToast('UNO ! 🎉', 2000);
    // UNO is declarative — handled visually for now
  });

  // Color picker
  document.querySelectorAll('.color-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.dataset.color;
      socket.emit('chooseColor', { color });
      colorOverlay.classList.remove('visible');
    });
  });

  // Reset / Quit
  document.getElementById('reset-btn').addEventListener('click', () => {
    socket.emit('resetGame');
    winnerOverlay.classList.remove('visible');
  });

  document.getElementById('quit-btn').addEventListener('click', () => {
    window.location.href = '/homepage';
  });

  document.getElementById('quit-win-btn').addEventListener('click', () => {
    window.location.href = '/homepage';
  });

  // ─── Socket events ────────────────────────────────────
  socket.on('connect', () => {
    console.log('Connecté:', socket.id);

    // Nouveau socket après redirection → rejoindre la game room sauvegardée
    const gameRoomId  = localStorage.getItem('gameRoomId');
    const playerNames = JSON.parse(localStorage.getItem('playerNames') || '[]');

    if (gameRoomId && playerNames.length > 0) {
      // Identifier mon index immédiatement
      myIndex = playerNames.indexOf(myName);
      if (myIndex === -1) myIndex = 0;

      // Demander au serveur de nous ajouter dans la room
      socket.emit('rejoinGame', { gameRoomId, playerName: myName });

      waitOverlay.classList.remove('visible');
      hasDrawn = false;
      showToast(`Partie lancée ! Tu es ${myName}`, 3000);
    }
  });

  socket.on('state', (state) => {
    // Reset hasDrawn when it becomes our turn
    if (myIndex !== null && state.current_player !== myIndex) {
      hasDrawn = false;
    }
    render(state);
  });

  socket.on('reset', () => {
    winnerOverlay.classList.remove('visible');
    waitOverlay.classList.add('visible');
    handContainer.innerHTML = '';
    opponentsEl.innerHTML   = '';
    hasDrawn = false;
    showToast('Nouvelle partie !', 2000);
  });

  socket.on('error', (msg) => {
    showToast(`⚠ ${msg}`);
  });

  socket.on('disconnect', () => {
    showToast('Déconnecté du serveur…', 4000);
  });
</script>
</body>
</html>

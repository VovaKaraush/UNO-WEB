<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Web - En ligne</title>
  <link rel="stylesheet" href="/Online/styles.css">
</head>

<body>
  <div class="online-page">

    <header class="hero-online">
      <div>
        <a class="back-link" href="../Acceuil/index.html">← Retour menu</a>

        <div class="online-title">
          <h1>En ligne</h1>
          <p>Créer un lobby ou rejoindre une partie</p>
        </div>
      </div>

      <div class="profile">
        <div class="profile-card">
          <div class="name" id="username-online">Shori_Matt</div>
          <div class="coins">700 🪙</div>
          <div class="level"><span></span></div>
        </div>
        <div class="avatar">🧑</div>
      </div>
    </header>

    <section class="lobby-layout">

      <!-- LISTE DES SALONS -->
      <div class="panel">
        <h2>Salons</h2>

        <div class="room-list">

          <div class="room-card">
            <div class="room-meta">
              <h3>Salon rapide</h3>
              <p>3/4 joueurs • Classique</p>
              <span class="status waiting">En attente</span>
            </div>
            <button class="join-btn">Rejoindre</button>
          </div>

          <div class="room-card fun">
            <div class="room-meta">
              <h3>Mode +7 🔥</h3>
              <p>2/4 joueurs • Fun</p>
              <span class="status creating">Création</span>
            </div>
            <button class="join-btn">Rejoindre</button>
          </div>

          <div class="room-card private">
            <div class="room-meta">
              <h3>Amis uniquement</h3>
              <p>Privé • Code requis</p>
              <span class="status private">Privé</span>
            </div>
            <button class="join-btn">Code</button>
          </div>

        </div>
      </div>

      <!-- CREATION -->
      <div class="panel create-panel">
        <h2>Créer</h2>

        <form class="form-grid">

          <div class="field">
            <label>Nom</label>
            <input type="text" id="room-name" value="Salon de Shori_Matt">
          </div>

          <div class="field">
            <label>Mode</label>
            <select>
              <option>Classique</option>
              <option>Fun</option>
              <option>Rapide</option>
            </select>
          </div>

          <div class="field">
            <label>Joueurs</label>
            <select>
              <option>2</option>
              <option>3</option>
              <option selected>4</option>
            </select>
          </div>

          <div class="field">
            <label>Visibilité</label>
            <select>
              <option>Public</option>
              <option>Privé</option>
            </select>
          </div>

          <button type="button" class="create-btn">Créer</button>
          <button type="button" class="ghost-btn">Code privé</button>

        </form>

        <div class="preview">
          <h3>Aperçu</h3>

          <div class="mini-room">
            <div>
              <strong id="room-preview">Salon de Shori_Matt</strong>
              <span>4 joueurs • Classique</span>
            </div>
            <button class="join-btn">Prêt</button>
          </div>
        </div>

      </div>

    </section>
  </div>

  <script>
    // Récupérer le username depuis localStorage
    const userJson = localStorage.getItem('user');
    
    if (userJson) {
      try {
        const user = JSON.parse(userJson);
        if (user.username) {
          // Mettre à jour le profil en haut
          document.getElementById('username-online').textContent = user.username;
          
          // Mettre à jour le champ de création de salon
          const roomNameInput = document.getElementById('room-name');
          roomNameInput.value = `Salon de ${user.username}`;
          
          // Mettre à jour l'aperçu du salon
          document.getElementById('room-preview').textContent = `Salon de ${user.username}`;
        }
      } catch (error) {
        console.error('Erreur de parsing user:', error);
      }
    }
  </script>
</body>
</html>

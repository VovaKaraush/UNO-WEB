<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO - Menu</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <nav class="nav-icons">
        <div class="nav-item"><span class="icon">🧩</span><div class="label">My Profile</div></div>
        <div class="nav-item"><span class="icon">👥</span><div class="label">Amis</div></div>
        <div class="nav-item"><span class="icon">📊</span><div class="label">Classements</div></div>
        <div class="nav-item"><span class="icon">⚙️</span><div class="label">Options</div></div>
        <div class="nav-item"><span class="icon">🔐</span><div class="label">Connect</div></div>
      </nav>
      <div class="profile">
        <div class="profile-card">
          <div class="name">Shori_Matt</div>
          <div class="coins">700 $</div>
          <div class="level"><span></span></div>
        </div>
        <div class="avatar">?</div>
      </div>
    </header>

    <section class="grid">
      <article class="card local span-2-row">
        <div class="players">👤 1-2 joueurs</div>
        <div class="content">
          <div class="visual">
            <div class="uno-stack">
              <div class="uno-real-card yellow"><span class="num top">4</span><span class="num">4</span></div>
              <div class="uno-real-card blue"><span class="num top">4</span><span class="num">4</span></div>
            </div>
          </div>
          <div class="title">Local</div>
        </div>
      </article>

      <a class="card-link span-2-row" href="./online.html">
        <article class="card online">
          <div class="players">👥 2-4 joueurs</div>
          <div class="content">
            <div class="visual"><div class="globe"></div></div>
            <div class="title">En ligne</div>
          </div>
        </article>
      </a>

      <article class="card dark span-2-row">
        <div class="content">
          <div class="visual"><div class="big-icon">🎮</div></div>
          <div class="title" style="color:white;text-shadow:none">Mode</div>
        </div>
      </article>

      <article class="card events span-2-row">
        <div class="content">
          <div class="visual"><div class="big-icon">🗓️</div></div>
          <div class="title">Événements</div>
        </div>
      </article>

    </section>
  </div>
</body>
</html>

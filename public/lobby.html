<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNO Web - Lobby</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/">UNO<span>+</span></a>
        <div class="top-actions">
          <a class="glass-btn" href="/">Accueil</a>
          <button class="glass-btn" id="logoutBtn">Déconnexion</button>
        </div>
      </header>

      <section>
        <div class="pretitle">Lobby</div>
        <h1 class="page-title">Bienvenue <span id="welcomeUser"></span></h1>
        <p class="section-subtitle">Crée un salon, rejoins une partie ou lance ton match privé.</p>
      </section>

      <section class="lobby-grid">
        <article class="panel">
          <h2 class="page-title" style="font-size:34px; margin-top:0;">Créer un salon</h2>
          <form id="createRoomForm">
            <div class="form-row">
              <label for="roomName">Nom du salon</label>
              <input class="input" id="roomName" name="name" placeholder="Salon de Lucas" required />
            </div>
            <div class="form-row">
              <label for="maxPlayers">Nombre maximum de joueurs</label>
              <select class="select" id="maxPlayers" name="maxPlayers">
                <option value="2">2 joueurs</option>
                <option value="3">3 joueurs</option>
                <option value="4" selected>4 joueurs</option>
                <option value="5">5 joueurs</option>
                <option value="6">6 joueurs</option>
              </select>
            </div>
            <button class="primary-btn" type="submit">Créer le salon</button>
          </form>
          <div id="createRoomMsg"></div>

          <div class="notice">
            Le host peut lancer la partie dès qu'il y a au moins 2 joueurs.
          </div>
        </article>

        <article class="panel">
          <div class="two-cols" style="align-items:start; gap:22px;">
            <div>
              <h2 class="page-title" style="font-size:34px; margin-top:0;">Salons ouverts</h2>
              <div id="roomsList" class="room-list"></div>
            </div>
            <div>
              <div id="roomDetails"><div class="centered-empty">Sélectionne ou crée un salon pour commencer.</div></div>
              <div id="roomActions"></div>
            </div>
          </div>
        </article>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/lobby.js"></script>
  </body>
</html>
